name: Release

# 自动打包并发布到 GitHub Releases：
#   • 每次 push 到 main          → 自动更新「latest」滚动预发布
#   • 推送形如 v0.1.0 的 tag     → 出对应版本的「正式版」并自动发布（绿标 Latest，无需手动 Publish）
#   • Actions 页手动 Run workflow → 同 latest
# 注意：不对 push 加 paths 过滤——否则 tag 推送（无文件变更）会被跳过而不触发构建。
on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

# 连续推送时取消上一次未完成的构建，避免堆积
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # Apple Silicon (arm64) → .dmg
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin --bundles dmg"
          - platform: macos-latest # Intel (x86_64) → .dmg
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin --bundles dmg"
          - platform: ubuntu-22.04 # → .AppImage / .deb
            target: x86_64-unknown-linux-gnu
            args: "--bundles appimage,deb"
          - platform: windows-latest # → NSIS setup.exe
            target: x86_64-pc-windows-msvc
            args: "--bundles nsis"

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ contains(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Build standalone CLI
        run: cargo build --locked --release -p novel-cli --target ${{ matrix.target }}

      - name: Package standalone CLI
        shell: bash
        run: |
          mkdir -p cli-package
          cp README.md README_EN.md LICENSE cli-package/
          mkdir -p cli-package/docs
          cp docs/CLI.md cli-package/docs/
          if [[ "${{ matrix.platform }}" == "windows-latest" ]]; then
            cp target/${{ matrix.target }}/release/novel.exe cli-package/
            7z a novel-cli-${{ matrix.target }}.zip ./cli-package/*
          else
            cp target/${{ matrix.target }}/release/novel cli-package/
            tar -czf novel-cli-${{ matrix.target }}.tar.gz -C cli-package .
          fi

      - name: Build and release (Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          # tag 触发 → 用该版本号出正式版并自动发布；其余（push main / 手动）→ 滚动更新 latest 预发布
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('Sodarie Novel {0}', github.ref_name) || 'Sodarie Novel (latest)' }}
          # 永不出草稿：tag 直接发布成绿标正式版，main/手动 出 latest 预发布
          releaseDraft: false
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          releaseBody: |
            Sodarie Novel —— 本地大模型长篇小说写作台。

            下载对应平台的安装包：
            - Windows：`*-setup.exe`（NSIS 安装器）
            - macOS：`*.dmg`（arm64 / x64）
            - Linux：`*.AppImage` 或 `*.deb`
            - 独立 CLI：`novel-cli-<target>.zip` / `novel-cli-<target>.tar.gz`

            Windows 安装器包含 novel 命令；其他平台可解压独立 CLI 后加入 PATH。

            首次使用：打开后到「设置」填入本地 OpenAI 兼容服务地址（含 http://，多数在 /v1 下），即可开始。
            注：安装包未做代码签名，首次打开可能需在系统中允许运行。
          args: ${{ matrix.args }}

      - name: Upload standalone CLI to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
        run: gh release upload "$RELEASE_TAG" novel-cli-${{ matrix.target }}.* --clobber
