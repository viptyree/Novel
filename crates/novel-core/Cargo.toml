[package]
name = "novel-core"
version = "0.3.0"
edition = "2021"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
regex = "1"
chrono = "0.4"
dirs = "6"
fs2 = "0.4"
tempfile = "3"
